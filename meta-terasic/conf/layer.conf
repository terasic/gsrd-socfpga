# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-terasic"
BBFILE_PATTERN_meta-terasic = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-terasic = "21"

LAYERSERIES_COMPAT_meta-terasic = "scarthgap"
